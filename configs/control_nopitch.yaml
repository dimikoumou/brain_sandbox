# Control for the absolute-pitch question: identical to main_modular, but the
# pitch task is NEVER practised (weight 0). Its input and rule channels
# exist, so the absolute-pitch probe can be run in exactly the same way.
# Anything not listed takes its default from brain_sandbox/config.py; the run
# folder's config.yaml records every resolved value.
name: nopitch_modular
seeds: [0, 1, 2]
model:
  dale: true
  dt_ms: 20.0
  modules:
    - {name: sensory,    size: 64, tau_ms: 100, noise: 0.05}
    - {name: memory,     size: 64, tau_ms: 100, noise: 0.05}
    - {name: conceptual, size: 64, tau_ms: 100, noise: 0.05}
    - {name: executive,  size: 64, tau_ms: 100, noise: 0.05}
tasks:
  names: [go, anti, delaygo, dm1, dm2, ctxdm1, ctxdm2, dms, dnms, pitchdir]
  n_ring: 16
  n_tono: 36          # tonotopic units covering two octaves (C4..C6)
  n_choice: 2         # the two answer buttons of the pitch task ("up" / "down")
  weights: {pitchdir: 0.0}
train:
  n_iters: 25000      # upper limit; training normally stops earlier
  batch_size: 64
  lr: 0.003
  l2_rate: 0.0001     # pressure knob: cost of high activity
  l2_weight: 0.00001  # pressure knob: cost of large weights
  eval_every: 250
  eval_batch: 96
  stop_at_accuracy: 0.85       # every task at >= 85%, twice in a row...
  practice_after_criterion: 2000  # ...then 2000 more iterations of practice
